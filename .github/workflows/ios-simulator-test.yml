name: iOS Simulator Test

# ---------------------------------------------------------------------------
# Runs ONLY after a successful iOS IPA build (workflow_run gate) — IPA first,
# simulator second, per release discipline. Builds the app for the simulator,
# boots an iPad (7th gen) on iOS 18.5 when available, installs, and runs REAL
# interaction tests (XCUITest): onboarding, tab navigation, language switch
# to Arabic (RTL rebuild), reader tap-to-toggle chrome, color picker.
#
# Runtime choice: iOS 18.5 exactly matches the target device
# (iPad 7th generation 2019, iPadOS 18.5, A10 Fusion).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS IPA Build"]
    types: [completed]

concurrency:
  group: ios-simulator-test-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  BUNDLE_ID: com.rajarsheechatterjee.LNReader
  SIM_NAME: lnreader-test-ipad

jobs:
  await-ipa:
    name: Gate on IPA build success
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm upstream success (workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          echo "Upstream workflow: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Manual dispatch (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual run on ${{ github.ref_name }} — upstream gate not applicable"

  simulator-test:
    name: iPad 7th gen · iOS 18.5 · interaction tests
    needs: await-ipa
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout (upstream head SHA)
        uses: actions/checkout@v7
        with:
          # workflow_run fires on the default branch; pin to the exact commit
          # the IPA build succeeded on so the simulator tests that commit.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Same reason as ios-build.yml: Expo 57 SPM packages need Swift tools
      # 6.2 -> Xcode 26. Runtimes (iOS 18.5) are shared via CoreSimulator and
      # boot fine under Xcode 26's simctl.
      - name: Select Xcode 26 + install iOS platform
        run: |
          set -e
          PREFERRED="/Applications/Xcode_26.1.1.app"
          if [ ! -d "$PREFERRED" ]; then
            PREFERRED=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$PREFERRED" ] || [ ! -d "$PREFERRED" ]; then
            echo "No Xcode 26 found"; ls /Applications | grep -i xcode; exit 1
          fi
          echo "Selecting: $PREFERRED"
          sudo xcode-select -s "$PREFERRED"
          xcodebuild -version
          # Xcode 26 on this image ships WITHOUT the iOS platform components
          # (Apple's on-demand platform downloads) — required for both device
          # and simulator destinations.
          sudo xcodebuild -runFirstLaunch || true
          # Fresh runners occasionally have a wedged CoreSimulatorService
          # ("Unable to connect to simulator" from -downloadPlatform — runs
          # #17/#18 failed transiently at exactly this point). Restart it.
          sudo launchctl kickstart -k system/com.apple.CoreSimulator.CoreSimulatorService || true
          sleep 10
          # Installs device+simulator platform SDKs; idempotent when present.
          for ATTEMPT in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              echo "iOS platform installed/verified (attempt $ATTEMPT) ✓"
              break
            fi
            if [ "$ATTEMPT" = "3" ]; then
              echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts"
              exit 1
            fi
            echo "attempt $ATTEMPT failed — retrying in 30s"
            sleep 30
          done
          echo "== iOS runtimes ==" && xcrun simctl list runtimes | grep -i ios || true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        run: npm install -g pnpm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build env (Release)
        env:
          MYANIMELIST_CLIENT_ID: ${{ vars.MYANIMELIST_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: pnpm run generate:env:release

      - name: Expo prebuild (iOS, CNG)
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Pod install
        run: |
          set -o pipefail
          cd ios
          pod install 2>&1 | tee pod-install.log

      - name: Build for iOS Simulator (Release)
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace LNReader.xcworkspace \
            -scheme LNReader \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../xcodebuild-sim.log | xcbeautify --renderer github-actions
          # Real gate: complete app bundle (binary + plist + JS bundle).
          APP=../build-sim/Build/Products/Release-iphonesimulator/LNReader.app
          test -d "$APP"
          test -f "$APP/LNReader"
          test -f "$APP/Info.plist"
          test -f "$APP/main.jsbundle"

      - name: Assert reader WebView assets are bundled (simulator app)
        run: |
          APP=build-sim/Build/Products/Release-iphonesimulator/LNReader.app
          test -d "$APP/ReaderAssets" || { echo "MISSING ReaderAssets"; ls "$APP"; exit 1; }
          test -f "$APP/ReaderAssets/css/index.css" || { echo "MISSING css"; exit 1; }
          test -f "$APP/ReaderAssets/js/core.js"    || { echo "MISSING js"; exit 1; }
          test -f "$APP/ReaderAssets/fonts/lato.ttf" || { echo "MISSING fonts"; exit 1; }
          echo "ReaderAssets present in simulator app bundle ✓"

      - name: Create + boot iPad (7th generation) on newest iOS runtime
        run: |
          set -x
          # Prefer the exact target runtime (18.5), then any 18.x. NOTE: the
          # macos-26 runner image no longer ships iOS 18.x runtimes (only
          # 26.1-26.5 — see run #15 logs), so launch testing falls back to
          # the newest available iOS runtime. Device compatibility with
          # iPadOS 18.5 is guaranteed by MinOS 16.4 <= 18.5 + arm64 (verified
          # in the IPA pipeline), not by the simulator runtime version.
          # Target-device fidelity: try to fetch the exact iOS 18.5 runtime
          # (iPad 7th gen ships iPadOS 18.5). Non-fatal when unavailable.
          if ! xcrun simctl list runtimes | grep -q 'iOS 18.5'; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5 || \
              echo "::warning::iOS 18.5 runtime unavailable — using fallback"
          fi
          RUNTIME=$(xcrun simctl list runtimes | grep 'iOS 18.5' | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-18-5' || true)
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(xcrun simctl list runtimes | grep -E 'iOS 18\.' | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-18-[0-9]+' || true)
          fi
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+-[0-9]+' | tail -1)
          fi
          echo "Using runtime: $RUNTIME"

          # NOTE: the human-readable devicetype line is
          #   "iPad (7th generation) (com.apple.CoreSimulator.SimDeviceInfoType.…)"
          # — the NAME ITSELF contains parentheses, so a generic
          # 'extract second paren group' sed grabs "7th generation" (run #15:
          # 'Invalid device type: 7th generation'). Extract the identifier
          # directly instead.
          # The identifier token in `simctl list devicetypes` output is
          # "SimDeviceType" (run #19 confirmed SimDeviceInfoType never
          # matches — result was an empty DEVICE_TYPE).
          DEVICE_TYPE=$(xcrun simctl list devicetypes | grep 'iPad (7th generation)' | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+' | head -1 || true)
          if [ -z "$DEVICE_TYPE" ]; then
            # Newer runtimes may drop the A10-era device type — any iPad
            # satisfies the launch/stability smoke test; the actually used
            # device+runtime pair is recorded in SIM_RUNTIME_USED.
            DEVICE_TYPE=$(xcrun simctl list devicetypes | grep -E '\(com\.apple\.CoreSimulator\.SimDeviceType\.iPad' | head -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+' || true)
          fi
          echo "Device type: $DEVICE_TYPE"
          test -n "$DEVICE_TYPE" || { echo "::error::no iPad devicetype found"; exit 1; }

          xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE" "$RUNTIME"
          echo "SIM_RUNTIME_USED=$RUNTIME" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_NAME"
          xcrun simctl bootstatus "$SIM_NAME" -b
          xcrun simctl list devices | grep -A 5 -i booted || true

      - name: Install & launch app on simulator
        run: |
          xcrun simctl install "$SIM_NAME" build-sim/Build/Products/Release-iphonesimulator/LNReader.app
          set -x
          xcrun simctl launch "$SIM_NAME" "$BUNDLE_ID"

      - name: Install xcodegen + generate e2e project
        run: |
          brew install xcodegen
          cd e2e && xcodegen generate

      - name: Run UI interaction tests (XCUITest)
        run: |
          set -o pipefail
          SIM_UDID=$(xcrun simctl list devices | grep "$SIM_NAME (" | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          echo "Simulator UDID: $SIM_UDID"
          # The app is already installed + booted; terminate the manual launch
          # so the test runner starts it cleanly.
          xcrun simctl terminate "$SIM_NAME" "$BUNDLE_ID" 2>/dev/null || true

          # AX warmup: a freshly booted simulator frequently times out the UI
          # test runner with "Timed out waiting for AX loaded notification".
          # Launching the app once and letting it settle initializes the
          # accessibility subsystem before the runner attaches.
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 25
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
          sleep 5

          cd e2e
          ATTEMPT=1
          while [ "$ATTEMPT" -le 3 ]; do
            echo "=== UI test attempt $ATTEMPT ==="
            set +e
            xcodebuild test \
              -project LNReaderUITests.xcodeproj \
              -scheme LNReaderUITests \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -derivedDataPath ../build-e2e \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              2>&1 | tee ../xcodebuild-e2e.log | xcbeautify --renderer github-actions
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -eq 0 ]; then
              echo "UI tests passed on attempt $ATTEMPT"
              exit 0
            fi
            if grep -q "Timed out waiting for AX" ../xcodebuild-e2e.log; then
              echo "::warning::AX init timeout (attempt $ATTEMPT) — warming up and retrying"
              xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" || true
              sleep 30
              xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
              sleep 5
              ATTEMPT=$((ATTEMPT+1))
            else
              echo "Real test failure (not AX init) — no retry"
              exit 1
            fi
          done
          echo "::error::UI tests failed after 3 attempts"
          exit 1

      - name: Collect UI test screenshots
        if: always()
        run: |
          mkdir -p artifacts/e2e-screenshots
          cp /tmp/lnreader-e2e/*.png artifacts/e2e-screenshots/ 2>/dev/null || true
          ls -la artifacts/e2e-screenshots || true

      # App-side console output (JS exceptions at launch show up here, not in
      # the xcodebuild test log) — without this a blank-screen failure is
      # undebuggable from CI.
      - name: Collect app console log
        if: always()
        run: |
          SIM_UDID=$(xcrun simctl list devices | grep "$SIM_NAME (" | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl spawn "$SIM_UDID" log show \
            --last 15m --style compact \
            --predicate 'processImagePath CONTAINS "LNReader"' \
            > artifacts/lnreader-console.log 2>&1 || true
          tail -c 200000 artifacts/lnreader-console.log | grep -iE "error|exception|fatal|ReactNativeJS" | head -80 || true

      - name: Post-run stability watch (60s)
        run: |
          sleep 30
          mkdir -p artifacts/screenshots
          xcrun simctl io "$SIM_NAME" screenshot artifacts/screenshots/03-after-120s.png || true
          sleep 30
          xcrun simctl io "$SIM_NAME" screenshot artifacts/screenshots/04-after-150s.png || true
          if xcrun simctl spawn "$SIM_NAME" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "App process alive after interaction tests + 60s ✓"
          else
            echo "::warning::app not running after tests (may have been terminated by the runner)"
            xcrun simctl spawn "$SIM_NAME" log show --last 5m --style compact > artifacts/sim-crash-log.txt || true
          fi

      - name: Collect simulator logs
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "$SIM_NAME" log show --last 10m --style compact > artifacts/simulator-log.txt 2>/dev/null || true
          xcrun simctl list devices > artifacts/simctl-devices.txt 2>/dev/null || true
          cp xcodebuild-sim.log artifacts/ 2>/dev/null || true
          cp xcodebuild-e2e.log artifacts/ 2>/dev/null || true
          cp ios/pod-install.log artifacts/ 2>/dev/null || true
          ls -R artifacts || true

      - name: Upload simulator artifacts (screenshots · logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-artifacts
          path: artifacts/
          retention-days: 30
